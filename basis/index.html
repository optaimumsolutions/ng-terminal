<!doctype html>

<title>Gas Basis</title>
<style>
:root{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --sec:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --blue:#3987e5; --amber:#c98500; --pos:#0ca30c; --neg:#d03b3b;
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font:13px/1.5 "Cascadia Mono","Consolas",monospace;padding:0 0 40px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:5}
header h1{font-size:15px;letter-spacing:2px}
header h1 b{color:var(--amber)}
#cutoff{color:var(--muted);font-size:11px;margin-left:auto}
main{max-width:1180px;margin:18px auto;padding:0 22px}
.navbtn{background:none;border:1px solid var(--border);color:var(--sec);font:inherit;padding:4px 12px;cursor:pointer;letter-spacing:1px}
.navbtn.on,.navbtn:hover{border-color:var(--amber);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--border);padding:14px 16px}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--amber)}
.card h2{font-size:12px;letter-spacing:2px;color:var(--amber);margin-bottom:8px}
.card p{margin:4px 0}
.homegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.agrid{display:grid;grid-template-columns:minmax(330px,2fr) 3fr;gap:14px;align-items:start}
@media(max-width:900px){.homegrid,.agrid{grid-template-columns:1fr}}
.roundhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.roundhead h2{font-size:14px;letter-spacing:2px}
.score{color:var(--sec)}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:3px 8px;text-align:left;border-bottom:1px solid var(--grid)}
.tbl th{color:var(--muted);font-weight:normal;font-size:11px;letter-spacing:1px}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .sect td{color:var(--muted);letter-spacing:2px;font-size:11px;padding-top:9px;border-bottom:1px solid var(--baseline)}
.tbl .hl td{background:rgba(201,133,0,.12)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.buckets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bk{background:var(--page);border:1px solid var(--border);color:var(--ink);font:inherit;padding:10px 4px;cursor:pointer;letter-spacing:1px}
.bk span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.bk:hover:not(:disabled){border-color:var(--blue);background:rgba(57,135,229,.08)}
.bk:disabled{opacity:.5;cursor:default}
.btn{background:var(--page);border:1px solid var(--amber);color:var(--ink);font:inherit;padding:6px 14px;cursor:pointer;letter-spacing:1px}
.btn:hover{background:rgba(201,133,0,.12)}
.btn.ghost{border-color:var(--border);color:var(--sec)}
input{background:var(--page);border:1px solid var(--border);color:var(--ink);font:inherit;padding:3px 6px}
.abbr{border-bottom:1px dotted var(--muted);cursor:help;position:relative}
.abbr:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:20;width:260px;background:var(--page);border:1px solid var(--amber);padding:8px 10px;color:var(--sec);font-size:11px;line-height:1.45;white-space:normal}
.chartwrap{position:relative}
.charttip{display:none;position:absolute;z-index:15;background:var(--page);border:1px solid var(--border);padding:6px 9px;font-size:11px;pointer-events:none;min-width:150px}
sup{color:var(--muted)}
</style>
</head>

const CONCEPTS = [
  ["Basis = local price − Henry Hub",
   "Every US gas hub is quoted as a spread to Henry Hub. If HH is $3.00 and Waha basis is −$1.50, Waha gas is worth $1.50. Fixed price at any hub = HH futures + basis."],
  ["What a basis swap is",
   "A financially settled swap on the spread. You lock a fixed basis (say −$1.50 for Waha July). At settlement you receive/pay: (monthly index at the hub − NYMEX HH final settle) − fixed basis. Usually the hub's monthly bidweek index (Platts IFERC) vs the NYMEX last-day settle, cleared on ICE. A producer hedged only on HH futures still has BASIS RISK — this swap closes it."],
  ["The three things inside basis",
   "① Transport cost between the hub and HH (sets the 'normal' level). ② Congestion: when pipes between two hubs are full, the spread stops being transport cost and becomes whatever it takes to ration flow — this is what blows basis out. ③ Local supply/demand shocks (weather, outages, maintenance)."],
  ["Supply PUSH vs demand PULL",
   "PUSH hubs sit in producing basins (Waha, Eastern Gas South, AECO, Rockies): gas must leave, so they trade at a DISCOUNT that widens when takeaway is full. PULL hubs sit at the end of the pipe in big demand centers (Transco Z6 NY, Algonquin, SoCal): gas must come in, so they carry a PREMIUM that spikes when inbound pipes are full."],
  ["Seasonality",
   "Northeast pull hubs: big winter premium (heating), summer at par or discount. Florida / Southeast / California: premium in summer too (power burn for A/C). Producing hubs: often widest in the SHOULDER months (spring/fall) — low local demand + pipeline maintenance season."],

function fixedPriceQ() {
  // generated math drill: fixed price = HH + basis, or back out basis
  const pool = HUBS.filter(h => h.arch !== "bench");
  const h = pool[Math.floor(Math.random() * pool.length)];
  const season = Math.random() < 0.5 ? "win" : "sum";
  const [lo, hi] = h[season];
  const basis = Math.round((lo + Math.random() * (hi - lo)) * 20) / 20;
  const hh = Math.round((2.5 + Math.random() * 2.5) * 20) / 20;
  const ans = hh + basis;
  const offs = [0, 0.5, -0.5, 2 * basis === 0 ? 1 : -2 * basis].map(d => ans + d);
  const opts = [...new Set(offs.map(v => v.toFixed(2)))];
  while (opts.length < 4) opts.push((ans + opts.length * 0.25).toFixed(2));
  const shuffled = opts.slice(0, 4).sort(() => Math.random() - 0.5);
  const mon = season === "win" ? "January" : "July";
  return {
    q: `HH ${mon} futures = $${hh.toFixed(2)}. ${h.name} ${mon} basis = ${basis >= 0 ? "+" : "−"}$${Math.abs(basis).toFixed(2)}. What fixed price can you lock for ${h.name} gas?`,
    o: shuffled.map(v => "$" + v), a: shuffled.indexOf(ans.toFixed(2)),
    why: `Fixed price = HH + basis = $${hh.toFixed(2)} ${basis >= 0 ? "+" : "−"} $${Math.abs(basis).toFixed(2)} = $${ans.toFixed(2)}. To lock it you'd buy/sell HH futures AND a ${h.name} basis swap.`,
  };
}

function pushPullQ() {
  const pool = HUBS.filter(h => h.arch === "push" || h.arch === "pull");
  const h = pool[Math.floor(Math.random() * pool.length)];
  return {
    q: `${h.name} (${h.region}) — supply PUSH hub or demand PULL hub?`,
    o: ["Supply PUSH (trades at a discount)", "Demand PULL (trades at a premium)"], a: h.arch === "push" ? 0 : 1,
    why: h.why,
  };
}

function nextBasisQ() {
  const r = Math.random();
  if (r < 0.2) return fixedPriceQ();
  if (r < 0.35) return pushPullQ();
  return BASIS_QS[Math.floor(Math.random() * BASIS_QS.length)];
}

// shared basis scale for range bars: −$3 … +$10 (Algonquin's winter top is clipped, marked ▸)

function rangeBar(h) {
  if (h.arch === "bench") return `<div class="bx-rb"><div class="z" style="left:${rbx(0)}%"></div></div>`;
  const seg = (r, cls) => `<div class="s ${cls}" style="left:${rbx(r[0])}%;width:${Math.max(1.2, rbx(r[1]) - rbx(r[0]))}%;background:${bcol(r)}"></div>`;

    <div class="z" style="left:${rbx(0)}%"></div>${seg(h.win, "w")}${seg(h.sum, "u")}${clip}</div>`;
}

function basisMapSVG() {
  const outline = US_OUTLINE.map(p => `${PX(p[0]).toFixed(0)},${PY(p[1]).toFixed(0)}`).join(" ");
  const flows = FLOWS.map(([a, b, c, d, k]) => {
    const x1 = PX(a), y1 = PY(b), x2 = PX(c), y2 = PY(d);
    const mx = (x1 + x2) / 2 - (y2 - y1) * k, my = (y1 + y2) / 2 + (x2 - x1) * k;
    return `<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="#898781" stroke-opacity=".35" stroke-width="1.6" marker-end="url(#arr)"/>`;
  }).join("");
  const basins = BASINS.map(b => `<text x="${PX(b.lon)}" y="${PY(b.lat)}" fill="#6f6d68" font-size="10" letter-spacing="2" text-anchor="middle">${b.name}</text>`).join("");
  // geometry first, then greedy label placement so labels never sit on dots, basins or each other
  const G = HUBS.map(h => {
    const x = PX(h.lon), y = PY(h.lat), r = h[E.season], mid = (r[0] + r[1]) / 2;
    const rad = 5 + Math.min(9, Math.sqrt(Math.abs(mid)) * 3.2), on = h.id === E.hub;
    const nm = h.name.split(" (")[0].split(" /")[0];
    return { h, x, y, r, mid, rad, on, nm, show: on || !h.minor || E.labels === "all",
      chars: nm.length + (h.arch === "bench" ? 0 : 1 + brange(r).length) };
  });
  const boxes = G.map(g => ({ x0: g.x - g.rad - 2, x1: g.x + g.rad + 2, y0: g.y - g.rad - 2, y1: g.y + g.rad + 2, own: g.h.id }))

  const hit = (q, own) => q.x0 < -5 || q.x1 > 995 || boxes.some(o => o.own !== own && q.x0 < o.x1 && q.x1 > o.x0 && q.y0 < o.y1 && q.y1 > o.y0);
  const prio = g => g.on ? 0 : g.h.minor ? 2 : 1;
  G.slice().sort((a, b) => prio(a) - prio(b)).forEach(g => {
    if (!g.show) return;
    const { x, y, rad } = g, w = g.chars * (g.on ? 7.6 : 7.0);
    const right = (g.h.lon > -85 && g.h.id !== "chi") || g.h.lon < -117;
    const pref = LABEL_AT[g.h.id] ? LABEL_AT[g.h.id](x, y, rad) : [right ? "start" : "end", right ? x + rad + 4 : x - rad - 4, y + 4];
    const cands = [pref, ["start", x + rad + 4, y + 4], ["end", x - rad - 4, y + 4], ["middle", x, y - rad - 5], ["middle", x, y + rad + 13],
      ["start", x - 6, y - rad - 5], ["end", x + 6, y - rad - 5], ["start", x - 6, y + rad + 13], ["end", x + 6, y + rad + 13],
      ["middle", x, y - rad - 20], ["end", x - rad - 4, y - 12], ["start", x + rad + 4, y - 12]];
    const box = ([anc, lx, ly]) => { const x0 = anc === "start" ? lx : anc === "end" ? lx - w : lx - w / 2; return { x0, x1: x0 + w, y0: ly - 12, y1: ly + 4 }; };
    // first clean spot; if none, the spot with the least overlapping area
    const over = q => boxes.reduce((t, o) => o.own === g.h.id ? t : t + Math.max(0, Math.min(q.x1, o.x1) - Math.max(q.x0, o.x0)) * Math.max(0, Math.min(q.y1, o.y1) - Math.max(q.y0, o.y0)), 0)
      + (q.x0 < -5 || q.x1 > 995 ? 1e6 : 0);
    g.lab = cands.find(c => !hit(box(c), g.h.id)) || cands.reduce((best, c) => over(box(c)) < over(box(best)) ? c : best);
    boxes.push(box(g.lab));
  });
  const order = G.slice().sort((a, b) => a.on - b.on); // selected drawn on top
  const dots = order.map(({ h, x, y, r, mid, rad, on, nm, lab }) => {

      <title>${esc(h.name)} · ${h.arch === "bench" ? "benchmark" : brange(r)}</title>
      ${lab ? `<text x="${lab[1]}" y="${lab[2]}" font-size="${on ? 12 : 11}" text-anchor="${lab[0]}"><tspan fill="${on ? "#fff" : "#dcdbd3"}" font-weight="${on ? "bold" : "normal"}">${esc(nm)}</tspan>${h.arch === "bench" ? "" :
        `<tspan fill="${mid > 0.05 ? "#3fc53f" : mid < -0.05 ? "#ec6a6a" : "#9a9890"}"> ${brange(r)}</tspan>`}</text>` : ""}</g>`;
  }).join("");
  return `<svg viewBox="-5 10 1000 495" role="img" aria-label="US gas hubs and typical basis to Henry Hub">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#898781" fill-opacity=".6"/></marker></defs>
    <polygon points="${outline}" fill="#1d1d1b" stroke="#3a3a37" stroke-width="1.5"/>
    <text x="${PX(-97)}" y="${PY(26.4)}" fill="#6f6d68" font-size="10" letter-spacing="1">→ MEXICO</text>
    <text x="${PX(-92.6)}" y="${PY(28.6)}" fill="#c98500" font-size="10" letter-spacing="1">LNG EXPORTS ▼</text>
    ${flows}${basins}${dots}</svg>`;
}

function hubCard(h) {
  const tile = (l, r) => `<div class="bx-tile"><div class="l">${l}</div><div class="v" style="color:${bcol(r)}">${brange(r)}</div></div>`;
  return `<h2 style="margin-bottom:2px">${esc(h.name).toUpperCase()}</h2>
    <div class="muted">${esc(h.region)}</div>
    <span class="bx-pill" style="color:${ARCH_COL[h.arch]}">● ${ARCH_SHORT[h.arch]}</span>
    ${h.arch === "bench" ? `<div class="bx-tile" style="margin-bottom:10px"><div class="l">BASIS</div><div class="v">$0.00 — the reference price</div></div>` :
      `<div class="bx-tiles">${tile("WINTER BASIS · DEC–FEB", h.win)}${tile("SUMMER BASIS · JUN–AUG", h.sum)}</div>
       ${rangeBar(h)}<div class="muted" style="font-size:10px;margin-top:3px">range bar: winter (top) · summer (bottom) · scale −$3 to +$10, | = HH</div>`}
    <div class="bx-sec"><div class="l">WHERE THE GAS GOES</div><p>${esc(h.flow)}</p></div>
    <div class="bx-sec"><div class="l">WHY IT TRADES THIS WAY</div><p>${esc(h.why)}</p></div>
    <div class="bx-sec"><div class="l">WHAT BLOWS IT OUT</div><p>${esc(h.blowout)}</p></div>
    <div class="bx-sec"><div class="l">PIPES</div><div class="bx-chips">${h.pipes.split(", ").map(x => `<span>${esc(x)}</span>`).join("")}</div></div>`;
}

const ARCH_ORDER = { bench: 0, pull: 1, par: 2, push: 3 };
function renderModeE() {
  const st = (STATE.e = STATE.e || { n: 0, ok: 0 });
  const main = document.querySelector("main"); if (main) main.style.maxWidth = "1600px";
  const rows = HUBS.slice().sort((a, b) => ARCH_ORDER[a.arch] - ARCH_ORDER[b.arch] || (b.win[0] + b.win[1]) - (a.win[0] + a.win[1]));
  const seg = (k, opts) => `<div class="bx-seg">${opts.map(([v, l]) => `<button data-${k}="${v}" class="${E[k === "s" ? "season" : "labels"] === v ? "on" : ""}">${l}</button>`).join("")}</div>`;
  $("#view").innerHTML = BX_CSS + `
  <div class="roundhead"><div><h2>BASIS — where gas is pushed, where it's pulled</h2>
  <span class="muted">Every hub = Henry Hub + basis. Click any hub on the map or in the table. Drill at the bottom.</span></div>
  <div class="score" id="escore"></div></div>
  <div class="bx-top">
    <div class="card">
      <div class="bx-bar">
        ${seg("s", [["win", "WINTER · JAN"], ["sum", "SUMMER · JUL"]])}
        ${seg("l", [["key", "KEY LABELS"], ["all", "ALL LABELS"]])}
        <div class="bx-leg"><span><i style="background:#d03b3b"></i>push · discount</span><span><i style="background:#0ca30c"></i>pull · premium</span><span><i style="background:#3987e5"></i>near par</span><span><i style="background:#c98500"></i>Henry Hub</span><span>bigger dot = bigger basis</span></div>
      </div>
      <div class="bx-map" id="emap">${basisMapSVG()}</div>
      <p class="muted" style="font-size:11px;margin-top:8px">Arrows = dominant physical flow. Ranges are rule-of-thumb monthly (bidweek) basis from recent years, compiled from public reporting — NOT live or licensed data. Check ICE forwards before trading anything.</p>
    </div>
    <div class="card bx-panel" id="ehub">${hubCard(HUBS.find(h => h.id === E.hub))}</div>
  </div>
  <div class="card" style="margin-top:14px"><h2>CORE IDEAS</h2>
    <div class="bx-ideas">${CONCEPTS.map(([t, b], i) => `<div class="bx-idea"><b><span>${String(i + 1).padStart(2, "0")}</span>${esc(t)}</b><p>${esc(b)}</p></div>`).join("")}</div>
  </div>
  <div class="card" style="margin-top:14px"><h2>ALL HUBS — cheat sheet</h2>
    <table class="tbl bx-tbl"><tr><th>hub</th><th>type</th><th class="num">winter basis</th><th class="num">summer basis</th><th style="width:28%">range (−$3 … +$10)</th></tr>
    ${rows.map(h => `<tr class="click" data-h="${h.id}" style="cursor:pointer"><td>${esc(h.name)}<div class="muted" style="font-size:11px">${esc(h.region)}</div></td>
      <td><span style="color:${ARCH_COL[h.arch]}">●</span> ${ARCH_TXT[h.arch]}</td>
      <td class="num" style="color:${bcol(h.win)}">${brange(h.win)}</td><td class="num" style="color:${bcol(h.sum)}">${brange(h.sum)}</td>
      <td>${rangeBar(h)}</td></tr>`).join("")}</table>
  </div>
  <div class="card" style="margin-top:14px" id="equiz"></div>`;

  const redrawMap = () => { $("#emap").innerHTML = basisMapSVG(); bindMap(); };
  const bindMap = () => document.querySelectorAll("#emap .hubdot").forEach(g => g.onclick = () => selHub(g.dataset.h));
  const selHub = id => {
    E.hub = id;
    redrawMap();
    $("#ehub").innerHTML = hubCard(HUBS.find(h => h.id === id));
    $("#ehub").scrollTop = 0;
    document.querySelectorAll("tr[data-h]").forEach(r => r.classList.toggle("sel", r.dataset.h === id));
  };
  bindMap();
  document.querySelectorAll("tr[data-h]").forEach(r => r.onclick = () => { selHub(r.dataset.h); $("#emap").scrollIntoView({ behavior: "smooth", block: "nearest" }); });
  document.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => {
    E.season = b.dataset.s;
    document.querySelectorAll("button[data-s]").forEach(x => x.classList.toggle("on", x === b));
    redrawMap();
  });
  document.querySelectorAll("button[data-l]").forEach(b => b.onclick = () => {
    E.labels = b.dataset.l;
    document.querySelectorAll("button[data-l]").forEach(x => x.classList.toggle("on", x === b));
    redrawMap();
  });
  selHub(E.hub);
  scoreE();
  quizE();
}

function scoreE() {
  const st = STATE.e;
  $("#escore").textContent = st.n ? `drill ${st.ok}/${st.n} · ${Math.round(100 * st.ok / st.n)}%` : "drill 0/0";
}

function quizE() {
  const q = nextBasisQ(), st = STATE.e;
  $("#equiz").innerHTML = `<h2>BASIS DRILL</h2><p style="margin-bottom:12px;font-size:14px">${esc(q.q)}</p>
    <div class="bx-opts">${q.o.map((o, i) => `<button class="bx-opt" data-i="${i}"><b>${"ABCD"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="eans"></div>`;
  document.querySelectorAll("#equiz .bx-opt").forEach(b => b.onclick = () => {
    const ok = +b.dataset.i === q.a;
    st.n++; if (ok) st.ok++; saveState(STATE);
    document.querySelectorAll("#equiz .bx-opt").forEach(x => {
      x.disabled = true;
      if (+x.dataset.i === q.a) x.classList.add("ok");
      else if (x === b) x.classList.add("bad");
    });
    $("#eans").innerHTML = `<div class="bx-ans ${ok ? "ok" : "bad"}">
      <p>${ok ? "<span class='pos'>CORRECT</span>" : `<span class='neg'>MISS</span> — answer: <b>${esc(q.o[q.a])}</b>`}</p>
      <p style="color:var(--sec);margin-top:4px">${esc(q.why)}</p></div>
      <button class="btn" id="enext" style="margin-top:10px">NEXT QUESTION ▶</button>`;
    scoreE();
    $("#enext").onclick = quizE;
  });
}


</script>
<script>window.addEventListener("DOMContentLoaded", renderModeE);</script>
</body>
</html>
